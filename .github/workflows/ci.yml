name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test (with coverage on Node 22)
        if: matrix.node == '22.x'
        run: npx vitest run --coverage
        env:
          MCP_LOG_LEVEL: error

      - name: Test (Node 20)
        if: matrix.node != '22.x'
        run: npm test
        env:
          MCP_LOG_LEVEL: error

      - name: Upload coverage artifact
        if: always() && matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  test-web:
    name: web dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
