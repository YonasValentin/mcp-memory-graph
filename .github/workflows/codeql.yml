name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'   # Mondays at 05:00 UTC
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # CodeQL uploads results to GitHub code scanning, which requires GitHub
    # Advanced Security on a PRIVATE repo. Without it the upload fails (red CI on
    # every branch). Gate the job on an opt-in repo variable so it skips cleanly
    # until code scanning is available; set `ENABLE_CODEQL=true` (repo → Settings
    # → Secrets and variables → Actions → Variables) once GHAS/code scanning is on.
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
