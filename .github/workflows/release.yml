# Tag-triggered npm release with provenance attestation.
#
# Publishing uses npm Trusted Publishing (GitHub OIDC, no long-lived NPM_TOKEN):
# configure this repo as a trusted publisher for the package on npmjs.com once
# (package settings → Trusted Publishers → GitHub Actions, repo
# YonasValentin/mcp-memory-graph, workflow release.yml). `--provenance` then
# attaches a verifiable build attestation (Sigstore) linking the published
# tarball to this exact commit + workflow run.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing's OIDC token exchange needs npm >= 11.5; Node 22
      # bundles npm 10, which silently publishes unauthenticated (PUT 404).
      - run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly runs build:all, which compiles the web dashboard too
      - run: npm ci --prefix web
      - run: npm run build
      - run: npx vitest run
      - name: Verify tag matches package.json version
        run: |
          PKG_V="v$(node -p "require('./package.json').version")"
          if [ "$PKG_V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME != package.json $PKG_V" >&2
            exit 1
          fi
      - name: Publish to npm (skipped if this version is already published)
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "mcp-memory-graph@${V}" version >/dev/null 2>&1; then
            echo "mcp-memory-graph@${V} already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

  # Publish to the official MCP Registry (registry.modelcontextprotocol.io)
  # after the npm package is live. Ownership is proven by the mcpName field in
  # the published package.json; namespace auth uses GitHub OIDC (no secret).
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher
      - name: Sync server.json version to the tag
        run: |
          V="${GITHUB_REF_NAME#v}" node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            j.version = process.env.V;
            for (const p of j.packages) p.version = process.env.V;
            fs.writeFileSync('server.json', JSON.stringify(j, null, 2) + '\n');
          "
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
