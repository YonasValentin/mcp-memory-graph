name: audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 06:00 UTC. Catches new advisories on freshly released CVEs.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ['root', 'web']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      # Gate on SHIPPED dependencies only (--omit=dev): a vuln in a build/test
      # tool (vitest, esbuild, eslint) never reaches a user, so it shouldn't fail
      # the supply-chain gate. Production deps are audited at the high level.
      - name: Audit (root)
        if: matrix.workspace == 'root'
        run: npm audit --omit=dev --audit-level=high

      - name: Audit (web)
        if: matrix.workspace == 'web'
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
